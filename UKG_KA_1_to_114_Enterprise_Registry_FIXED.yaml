  Data_Dictionary:
    columns:
    - Column
    - Meaning
    row_count: 36
    rows:
    - Column: KA_ID
      Meaning: Canonical identifier (KA-001 … KA-114).
    - Column: KA_Name
      Meaning: Human-readable algorithm name.
    - Column: Short_Name
      Meaning: Short label used in traces/logs.
    - Column: Purpose
      Meaning: Single-responsibility description of what the KA does.
    - Column: Category
      Meaning: Reasoning/Truth/Safety/Compliance/Governance/etc.
    - Column: Primary_Layers
      Meaning: Where the KA typically runs in the 10-layer FROST stack.
    - Column: Allowed_Layers
      Meaning: Hard allow-list for where it is permitted to run.
    - Column: Inputs
      Meaning: Expected input artifacts.
    - Column: Outputs
      Meaning: Produced artifacts (structured).
    - Column: Reads_Memory
      Meaning: Whether it reads UKG/USKD long-term or cached memory.
    - Column: Writes_Memory
      Meaning: Whether it can write/update persisted memory.
    - Column: Can_Invoke_Chaos
      Meaning: Whether it can create perturbations / divergent assumptions.
    - Column: Can_Invoke_External_Research
      Meaning: Whether it can invoke external research providers (e.g., Deep Research).
    - Column: Can_Trigger_Recursion
      Meaning: Whether it can request deeper simulation/loopback.
    - Column: Can_Veto
      Meaning: Whether it can block/veto output or layer transitions.
    - Column: Risk_Class
      Meaning: Low/Medium/High/Critical based on safety & governance impact.
    - Column: Confidence_Impact
      Meaning: Direct ↑/↓, Indirect, or Neutral effect on confidence scoring.
    - Column: Entropy_Signal
      Meaning: Whether it produces/consumes entropy signals used for routing.
    - Column: Default_Params
      Meaning: Default knobs that govern behavior (budgets, thresholds, caps).
    - Column: Dependencies
      Meaning: Typical prerequisite KAs or inputs.
    - Column: Produces_Artifacts
      Meaning: Whether it emits structured artifacts (most do).
    - Column: Audit_Events
      Meaning: Whether execution must be logged for audit.
    - Column: Version
      Meaning: Semantic version for change control.
    - Column: Owner
      Meaning: Owning team/module.
    - Column: Status
      Meaning: Active/Reserved/Deprecated.
    - Column: Notes
      Meaning: Implementation notes and guardrails.
    - Column: TruthEngine_Component
      Meaning: TruthEngine component mapping (TruthGate/TruthCore/TruthMemory/TruthAudit/None)
    - Column: Veto_Scope
      Meaning: If Can_Veto=Yes, what scope is affected (pipeline/output/memory_write/external_call/layer_entry)
    - Column: Memory_Read_Tiers
      Meaning: Memory tiers read (none/stm/ltm/archive combinations)
    - Column: Memory_Write_Tiers
      Meaning: Memory tiers written (none/stm/ltm/archive combinations)
    - Column: Hard_Dependencies
      Meaning: Dependencies required for correct execution (normalized KA IDs)
    - Column: Soft_Dependencies
      Meaning: Optional helper dependencies (normalized KA IDs)
    - Column: Tier_Min
      Meaning: Minimum tier where KA may run (trivial/moderate/high_stakes/extreme/autonomous)
    - Column: Tier_Max
      Meaning: Maximum tier where KA may run (usually autonomous)
    - Column: Confidence_Impact_Normalized
      Meaning: Machine-friendly confidence impact enum
    - Column: Entropy_Signal_Normalized
      Meaning: Machine-friendly entropy signal enum
