version: '3.8'

services:
  # Backend Service (Flask)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ukg-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ukg_db
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
      - redis
    networks:
      - ukg-network
    restart: always

  # Frontend Service (Next.js)
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: ukg-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
    depends_on:
      - backend
    networks:
      - ukg-network
    restart: always

  # Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: ukg-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ukg_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ukg-network
    restart: always

  # Cache Service (Redis)
  redis:
    image: redis:7-alpine
    container_name: ukg-redis
    ports:
      - "6379:6379"
    networks:
      - ukg-network
    restart: always

networks:
  ukg-network:
    driver: bridge

volumes:
  postgres_data:
