openapi: 3.0.3
info:
  title: Universal Knowledge Graph (UKG) API
  description: |
    REST API for the Universal Knowledge Graph and Universal Simulated Knowledge Database system.
    
    ## Features
    - 13-Axis Knowledge Framework
    - 114 Knowledge Algorithms (KA-001 to KA-114)
    - Simulation Engine with 10-Layer Stack
    - Quad Persona System
    - AI-Powered Chat with OpenAI Integration
    - MCP Server Management
    
    ## Authentication
    Most endpoints require authentication. Login via the `/login` endpoint or use session cookies.
  version: 2.0.0
  contact:
    name: UKG API Support
  license:
    name: MIT

servers:
  - url: /
    description: Current server

paths:
  /api/ka/health:
    get:
      tags:
        - Knowledge Algorithms
      summary: Check KA system health
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                  total_algorithms:
                    type: integer
                  version:
                    type: string
                  registry_source:
                    type: string

  /api/ka/algorithms:
    get:
      tags:
        - Knowledge Algorithms
      summary: List all Knowledge Algorithms (114 total)
      parameters:
        - name: category
          in: query
          description: Filter by category (e.g., Reasoning, QA, Ethics)
          schema:
            type: string
        - name: status
          in: query
          description: Filter by status (Active, Draft, Deprecated)
          schema:
            type: string
        - name: risk_class
          in: query
          description: Filter by risk class (Low, Medium, High)
          schema:
            type: string
        - name: layer
          in: query
          description: Filter by simulation layer (L1-L10)
          schema:
            type: string
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Items per page
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of algorithms
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  algorithms:
                    type: array
                    items:
                      $ref: '#/components/schemas/KnowledgeAlgorithm'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  categories:
                    type: array
                    items:
                      type: string
                  total_count:
                    type: integer

  /api/ka/algorithms/{ka_id}:
    get:
      tags:
        - Knowledge Algorithms
      summary: Get algorithm details by ID
      parameters:
        - name: ka_id
          in: path
          required: true
          description: Algorithm ID (e.g., KA-001, KA-114, or numeric 1-114)
          schema:
            type: string
      responses:
        '200':
          description: Algorithm details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  algorithm:
                    $ref: '#/components/schemas/KnowledgeAlgorithm'
        '404':
          description: Algorithm not found

  /api/ka/algorithms/{ka_id}/execute:
    post:
      tags:
        - Knowledge Algorithms
      summary: Execute a Knowledge Algorithm
      security:
        - sessionAuth: []
      parameters:
        - name: ka_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
                params:
                  type: object
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  result:
                    $ref: '#/components/schemas/ExecutionResult'

  /api/ka/categories:
    get:
      tags:
        - Knowledge Algorithms
      summary: List algorithm categories with their algorithms
      responses:
        '200':
          description: Categories with algorithms
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  categories:
                    type: object
                  category_list:
                    type: array
                    items:
                      type: string
                  count:
                    type: integer

  /api/ka/layers:
    get:
      tags:
        - Knowledge Algorithms
      summary: List simulation layers and their algorithms
      responses:
        '200':
          description: Layers with associated algorithms
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  layers:
                    type: object
                  count:
                    type: integer

  /api/ka/search:
    get:
      tags:
        - Knowledge Algorithms
      summary: Search algorithms by name, purpose, or notes
      parameters:
        - name: q
          in: query
          required: true
          description: Search query (minimum 2 characters)
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  query:
                    type: string
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/KnowledgeAlgorithm'
                  count:
                    type: integer

  /api/ka/dependencies/{ka_id}:
    get:
      tags:
        - Knowledge Algorithms
      summary: Get algorithm dependency graph
      parameters:
        - name: ka_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dependency information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  algorithm:
                    type: object
                  dependencies:
                    type: array
                  dependents:
                    type: array
                  dependency_count:
                    type: integer
                  dependent_count:
                    type: integer

  /api/ka/stats:
    get:
      tags:
        - Knowledge Algorithms
      summary: Get KA system statistics
      responses:
        '200':
          description: System statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stats:
                    type: object
                    properties:
                      total_algorithms:
                        type: integer
                      by_category:
                        type: object
                      by_risk_class:
                        type: object
                      by_status:
                        type: object
                      by_implementation_mode:
                        type: object
                      with_math_components:
                        type: integer

  /api/ka/batch:
    post:
      tags:
        - Knowledge Algorithms
      summary: Execute multiple algorithms (max 20)
      security:
        - sessionAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                algorithms:
                  type: array
                  items:
                    type: string
                  maxItems: 20
                input:
                  type: object
      responses:
        '200':
          description: Batch execution results

  /api/ai/health:
    get:
      tags:
        - AI Chat
      summary: Check AI service health
      responses:
        '200':
          description: AI health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  configured:
                    type: boolean
                  service:
                    type: string

  /api/ai/chat:
    post:
      tags:
        - AI Chat
      summary: Send chat message to AI
      security:
        - sessionAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                conversation_history:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: AI response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /api/ai/analyze:
    post:
      tags:
        - AI Chat
      summary: Analyze query using 13-axis framework
      security:
        - sessionAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
      responses:
        '200':
          description: Analysis result

  /api/mcp/servers:
    get:
      tags:
        - MCP Servers
      summary: List MCP servers
      security:
        - sessionAuth: []
      responses:
        '200':
          description: List of servers
    post:
      tags:
        - MCP Servers
      summary: Create MCP server
      security:
        - sessionAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                version:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Server created

  /health:
    get:
      tags:
        - System
      summary: System health check
      responses:
        '200':
          description: System health status

components:
  schemas:
    KnowledgeAlgorithm:
      type: object
      properties:
        id:
          type: string
          example: KA-001
        name:
          type: string
          example: Algorithm of Thought
        short_name:
          type: string
          example: AoT
        purpose:
          type: string
        category:
          type: string
        primary_layers:
          type: array
          items:
            type: string
        allowed_layers:
          type: array
          items:
            type: string
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        capabilities:
          type: object
          properties:
            reads_memory:
              type: boolean
            writes_memory:
              type: boolean
            can_invoke_chaos:
              type: boolean
            can_invoke_external_research:
              type: boolean
            can_trigger_recursion:
              type: boolean
            can_veto:
              type: boolean
        risk_class:
          type: string
          enum: [Low, Medium, High]
        confidence_impact:
          type: string
        dependencies:
          type: array
          items:
            type: string
        version:
          type: string
        owner:
          type: string
        status:
          type: string
          enum: [Active, Draft, Deprecated]
        implementation:
          type: object
          properties:
            mode:
              type: string
            runtime_env:
              type: string
            primary_libraries:
              type: array
              items:
                type: string
        math:
          type: object
          properties:
            has_math:
              type: boolean
            component_type:
              type: string

    ExecutionResult:
      type: object
      properties:
        algorithm_id:
          type: string
        name:
          type: string
        short_name:
          type: string
        executed_at:
          type: string
          format: date-time
        status:
          type: string
        implementation_mode:
          type: string
        layers_used:
          type: array
          items:
            type: string
        output:
          type: object
        metrics:
          type: object
        artifacts_produced:
          type: boolean
        audit_logged:
          type: boolean

    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        pages:
          type: integer

  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: session

tags:
  - name: Knowledge Algorithms
    description: Knowledge Algorithm endpoints (KA-001 to KA-114)
  - name: AI Chat
    description: AI-powered chat and analysis
  - name: MCP Servers
    description: MCP server management
  - name: System
    description: System health and status
