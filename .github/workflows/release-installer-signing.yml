name: Release Installer Signing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: Product version, optionally followed by an rc suffix for candidate builds
        required: true
        type: string
      release_mode:
        description: Candidate builds produce qualification artifacts; production requires all authorities and signing
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - production

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    outputs:
      release_mode: ${{ steps.release-mode.outputs.value }}

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.11'

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Resolve release mode
      id: release-mode
      env:
        REQUESTED_RELEASE_MODE: ${{ inputs.release_mode }}
      run: |
        $mode = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
          [string]$env:REQUESTED_RELEASE_MODE
        } elseif ($env:GITHUB_REF_NAME -match '-rc[.-][0-9]+$') {
          'candidate'
        } else {
          'production'
        }
        if ($mode -notin @('candidate', 'production')) {
          throw "Unsupported release mode '$mode'."
        }
        "value=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "DLE_RELEASE_MODE=$mode" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Validate release source authority
      env:
        RELEASE_VERSION: ${{ inputs.release_version }}
      run: |
        if (git status --porcelain) {
          throw "Release builds require a clean checkout."
        }
        python scripts/verify_product_versions.py --report reports/product_version_parity_release.json
        python scripts/verify_lockfiles.py --json-report reports/lockfile_governance_report_release.json
        python scripts/verify_workflow_pins.py --json-report reports/workflow_pin_report_release.json
        python scripts/verify_legacy_retirement.py --report reports/legacy_retirement_report_release.json
        python scripts/verify_release_ownership.py --report reports/distribution_authority_release.json
        python scripts/verify_release_trust_policy.py --report reports/release_trust_policy_release.json
        if ($env:DLE_RELEASE_MODE -eq 'production') {
          python scripts/verify_release_ownership.py --require-release-ready --report reports/distribution_authority_release.json
          python scripts/verify_release_trust_policy.py --require-signing --require-updates --require-distribution --report reports/release_trust_policy_release.json
        }
        $authority = Get-Content config/product-versions.json -Raw | ConvertFrom-Json
        $expectedVersion = [string]$authority.product.version
        $requestedVersion = if ($env:GITHUB_REF -like 'refs/tags/*') {
          $env:GITHUB_REF_NAME.TrimStart('v')
        } else {
          [string]$env:RELEASE_VERSION
        }
        $requestedProductVersion = ($requestedVersion -split '-', 2)[0]
        if ($requestedProductVersion -ne $expectedVersion) {
          throw "Release version '$requestedVersion' does not match product authority '$expectedVersion'."
        }
        if ($env:DLE_RELEASE_MODE -eq 'production' -and $requestedVersion -ne $expectedVersion) {
          throw "Production release version '$requestedVersion' must exactly match '$expectedVersion'."
        }
        if ($env:DLE_RELEASE_MODE -eq 'candidate' -and $requestedVersion -notmatch "^$([regex]::Escape($expectedVersion))(-rc[.-][0-9]+)?$") {
          throw "Candidate release version '$requestedVersion' must be '$expectedVersion' or an rc suffix of it."
        }
        $channel = Get-Content config/release-channel.json -Raw | ConvertFrom-Json
        if ($env:DLE_RELEASE_MODE -eq 'candidate' -and ($channel.channel -ne 'candidate' -or $channel.data_plane_profile -ne 'qualification' -or $channel.production_authorized -ne $false)) {
          throw "Candidate builds require the fail-closed qualification release channel."
        }
        if ($env:DLE_RELEASE_MODE -eq 'production' -and ($channel.channel -ne 'production' -or $channel.data_plane_profile -ne 'production' -or $channel.production_authorized -ne $true)) {
          throw "Production builds require an explicitly authorized production release channel."
        }

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Install locked Python build dependencies
      run: |
        python -m pip install --require-hashes -r requirements.lock

    - name: Build unsigned installer
      run: |
        npm --prefix frontend run electron:dist

    - name: Verify versioned installer integrity
      run: |
        python scripts/verify_installer_integrity.py --require-artifacts --report reports/installer_integrity_release.json
        python scripts/verify_release_payload.py --report reports/release_payload_report_release.json

    - name: Generate release SBOMs and normalized content inventory
      run: |
        New-Item -ItemType Directory -Force reports/release | Out-Null
        cyclonedx-py requirements requirements.lock --output-file reports/release/sbom-backend.cdx.json
        Push-Location frontend
        npx --no-install cyclonedx-npm --package-lock-only --output-file ../reports/release/sbom-frontend.cdx.json
        Pop-Location
        python scripts/generate_service_asset_sbom.py --output reports/release/sbom-services.cdx.json
        $authority = Get-Content config/product-versions.json -Raw | ConvertFrom-Json
        $installer = Join-Path (Get-Location) "DataLogicEngine Setup $($authority.product.version).exe"
        python scripts/generate_release_content_inventory.py `
          --installer $installer `
          --output reports/release/release-content-inventory.json
        python scripts/generate_installer_sbom.py `
          --installer $installer `
          --backend-sbom reports/release/sbom-backend.cdx.json `
          --frontend-sbom reports/release/sbom-frontend.cdx.json `
          --services-sbom reports/release/sbom-services.cdx.json `
          --output reports/release/sbom-installer.cdx.json
        python scripts/generate_release_manifest.py --output reports/release/release-manifest.json

    - name: Upload unsigned installer artifacts
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      with:
        name: unsigned-installers
        path: |
          DataLogicEngine Setup *.exe
          DataLogicEngine Setup *.exe.sha256
          DataLogicEngine Setup *.exe.blockmap
          reports/product_version_parity_release.json
          reports/lockfile_governance_report_release.json
          reports/workflow_pin_report_release.json
          reports/legacy_retirement_report_release.json
          reports/distribution_authority_release.json
          reports/release_trust_policy_release.json
          reports/installer_integrity_release.json
          reports/release_payload_report_release.json
          reports/release/
        if-no-files-found: error

  sign-installer:
    name: Sign Installer Artifacts
    needs: build-installer
    if: needs.build-installer.outputs.release_mode == 'production'
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.11'

    - name: Download unsigned installers
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: unsigned-installers
        path: .

    - name: Validate code-signing secrets
      env:
        WINDOWS_CODESIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
        WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
      run: |
        if (-not $env:WINDOWS_CODESIGN_CERT_BASE64) {
          throw "Missing secret WINDOWS_CODESIGN_CERT_BASE64."
        }
        if (-not $env:WINDOWS_CODESIGN_CERT_PASSWORD) {
          throw "Missing secret WINDOWS_CODESIGN_CERT_PASSWORD."
        }

    - name: Decode PFX certificate
      id: cert
      env:
        WINDOWS_CODESIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
      run: |
        $certPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
        [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERT_BASE64))
        "path=$certPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Validate certificate rotation + revocation health
      env:
        WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
      run: |
        powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/verify_signing_certificate_health.ps1 `
          -CertificatePath "${{ steps.cert.outputs.path }}" `
          -CertificatePassword "$env:WINDOWS_CODESIGN_CERT_PASSWORD" `
          -MinDaysRemaining 45 `
          -CheckRevocation

    - name: Sign and verify installers
      env:
        WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
      run: |
        powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/sign_release_installers.ps1 `
          -RepoRoot (Get-Location).Path `
          -CertificatePath "${{ steps.cert.outputs.path }}" `
          -CertificatePassword "$env:WINDOWS_CODESIGN_CERT_PASSWORD" `
          -MinimumCertificateDaysRemaining 45 `
          -CheckCertificateRevocation `
          -CheckSignatureRevocation

    - name: Refresh final signed artifact evidence
      run: |
        $authority = Get-Content config/product-versions.json -Raw | ConvertFrom-Json
        $installer = Join-Path (Get-Location) "DataLogicEngine Setup $($authority.product.version).exe"
        Copy-Item reports/release/release-content-inventory.json reports/release/release-content-inventory.unsigned.json
        python scripts/generate_release_content_inventory.py `
          --installer $installer `
          --prior-payload-inventory reports/release/release-content-inventory.unsigned.json `
          --output reports/release/release-content-inventory.json
        python scripts/generate_installer_sbom.py `
          --installer $installer `
          --backend-sbom reports/release/sbom-backend.cdx.json `
          --frontend-sbom reports/release/sbom-frontend.cdx.json `
          --services-sbom reports/release/sbom-services.cdx.json `
          --output reports/release/sbom-installer.cdx.json
        python scripts/verify_installer_integrity.py --require-artifacts --report reports/installer_integrity_release.json
        python scripts/generate_release_manifest.py --output reports/release/release-manifest.json --require-clean --require-artifacts --require-release-authority

    - name: Attest signed installer provenance
      uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
      with:
        subject-path: 'DataLogicEngine Setup *.exe'

    - name: Attest signed installer SBOM
      uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
      with:
        subject-path: 'DataLogicEngine Setup *.exe'
        sbom-path: reports/release/sbom-installer.cdx.json

    - name: Verify published artifact attestations
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $installer = Get-ChildItem -File -Filter "DataLogicEngine Setup *.exe" | Select-Object -First 1
        if (-not $installer) { throw "Signed installer is missing." }
        gh attestation verify $installer.FullName --repo $env:GITHUB_REPOSITORY

    - name: Upload signed installer artifacts
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      with:
        name: signed-installers
        path: |
          DataLogicEngine Setup *.exe
          DataLogicEngine Setup *.exe.sha256
          DataLogicEngine Setup *.exe.blockmap
          reports/codesigning_certificate_health.json
          reports/installer_signature_report.json
          reports/installer_integrity_release.json
          reports/release/
        if-no-files-found: error
