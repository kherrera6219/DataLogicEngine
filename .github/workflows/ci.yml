name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev", "develop" ]
  pull_request:
    branches: [ "main", "dev", "develop" ]

jobs:
  # Coding Standards
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Ruff
      run: pip install ruff
    - name: Run Ruff
      run: ruff check . --select E9,F63,F7

  # Backend Tests
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pip-audit
        pip install neo4j bleach user-agents web3 fastapi reportlab asgiref python-json-logger simple-salesforce jira

    - name: Security Audit
      run: |
        pip-audit -r requirements.txt --desc

    - name: Run Tests
      run: |
        pytest tests/
      env:
        DATABASE_URL: "sqlite:///:memory:"
        OPENAI_API_KEY: "mock-key-for-ci"
        FLASK_ENV: "testing"
        SESSION_SECRET: "ci-session-secret"
        SECRET_KEY: "ci-test-secret-key"
        JWT_SECRET_KEY: "ci-test-jwt-secret"

  # Frontend Build
  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install Dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Build Next.js
      run: |
        cd frontend
        npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1

  # Docker Build (Verification)
  docker-build:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Backend Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: backend/Dockerfile
        push: false
        tags: ukg-backend:latest
        
    - name: Build Frontend Image
      uses: docker/build-push-action@v6
      with:
        context: frontend
        file: frontend/Dockerfile
        push: false
        tags: ukg-frontend:latest
