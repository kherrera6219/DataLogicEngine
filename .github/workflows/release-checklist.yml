name: Release Checklist Governance

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-checklist:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'

    - name: Validate release checklist docs exist
      run: |
        test -f docs/RELEASE_CHECKLIST.md
        test -f docs/BRANCH_PROTECTION_POLICY.md
        test -f docs/DOCS_VERSION.json

    - name: Validate changelog entry for tag
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        TAG_NAME: ${{ github.ref_name }}
      run: |
        VERSION="${TAG_NAME#v}"
        if ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
          echo "::error::Missing changelog section for version $VERSION"
          exit 1
        fi

    - name: Governance parity checks
      run: |
        python scripts/verify_environment_parity.py --strict --json-report reports/environment_parity_report_release.json
        python scripts/verify_lockfiles.py --json-report reports/lockfile_governance_report_release.json
        python scripts/verify_product_versions.py --report reports/product_version_parity_release.json
        python scripts/verify_workflow_pins.py --json-report reports/workflow_pin_report_release.json
        python scripts/verify_legacy_retirement.py --report reports/legacy_retirement_report_release.json

    - name: Upload governance reports
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      if: always()
      with:
        name: release-governance-reports
        path: |
          reports/environment_parity_report_release.json
          reports/lockfile_governance_report_release.json
          reports/product_version_parity_release.json
          reports/workflow_pin_report_release.json
          reports/legacy_retirement_report_release.json
        if-no-files-found: error
