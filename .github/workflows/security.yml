name: Security Scan

on:
  push:
    branches: [ main, dev, develop ]
  pull_request:
    branches: [ main, dev, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install pip-audit==2.10.0

    - name: Run pip-audit on locked requirements
      # CVE-2025-3000: memory corruption in torch.jit.script, local-host attack
      # only, no patched torch release exists. torch is a transitive dependency
      # (transformers / sentence-transformers) and the app never calls
      # torch.jit.script on any input — not reachable. Accepted-risk suppression;
      # revisit when an upstream fix ships. See TODO.md "CI And Security Evidence".
      # CVE-2026-12243: nltk path traversal, no patch available for 3.9.x yet.
      # PYSEC-2026-311 / GHSA-f4j7-r4q5-qw2c: no patched ChromaDB release exists.
      # The app rejects persisted embedding functions and does not expose the
      # vulnerable Python server path, but production release remains blocked
      # until a patched candidate passes adversarial installed qualification.
      run: |
        pip-audit -r requirements.lock --desc --format json --output pip-audit-report.json \
          --ignore-vuln CVE-2025-3000 \
          --ignore-vuln CVE-2026-12243 \
          --ignore-vuln PYSEC-2026-311

    - name: Upload dependency scan report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: pip-audit-report
        path: pip-audit-report.json

  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'

    - name: Run npm audit
      env:
        # npm audit only needs the dependency tree, not the binaries. Skipping
        # the electron/chromedriver postinstall downloads keeps this job from
        # flaking on transient CDN errors (e.g. HTTP 502 from electron install.js).
        ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        CHROMEDRIVER_SKIP_DOWNLOAD: true
      run: |
        cd frontend
        npm ci
        set +e
        npm audit --audit-level=high --json > ../npm-audit.json
        audit_status=$?
        set -e
        cat ../npm-audit.json
        exit "$audit_status"

    - name: Upload npm audit report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: npm-audit-report
        path: npm-audit.json

  code-security:
    name: Code Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Install bandit
      run: pip install bandit[toml]==1.9.3

    - name: Run Bandit full report
      run: |
        bandit -r backend/ core/ --exit-zero -f json -o bandit-full-report.json

    - name: Validate Bandit baseline exists
      run: |
        test -f .bandit-baseline.json

    - name: Normalize Bandit baseline paths
      run: |
        python - <<'PY'
        import json
        from pathlib import Path

        source = Path(".bandit-baseline.json")
        target = Path(".bandit-baseline.ci.json")
        data = json.loads(source.read_text())

        metrics = data.get("metrics", {})
        data["metrics"] = {
            key.replace("\\", "/") if key != "_totals" else key: value
            for key, value in metrics.items()
        }
        for result in data.get("results", []):
            filename = result.get("filename")
            if isinstance(filename, str):
                result["filename"] = filename.replace("\\", "/")

        target.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
        PY

    - name: Run Bandit delta gate (new high-confidence issues)
      run: |
        bandit -r backend/ core/ -b .bandit-baseline.ci.json --exit-zero -f json -o bandit-report.json
        bandit -r backend/ core/ -b .bandit-baseline.ci.json -ll -ii -f screen

    - name: Upload Bandit report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: bandit-report
        path: |
          bandit-report.json
          bandit-full-report.json

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0

    - name: Resolve TruffleHog diff range
      if: github.event_name != 'schedule'
      id: trufflehog-diff
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      with:
        script: |
          const before = context.payload.before || '';
          const isZero = /^0+$/.test(before);
          let base = before;
          if (context.eventName === 'pull_request') {
            base = context.payload.pull_request.base.sha;
          } else if (!base || isZero) {
            const commits = (await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 2,
              sha: context.sha,
            })).data;
            base = commits.length > 1 ? commits[commits.length - 1].sha : context.sha;
          }
          core.setOutput('base', base);
          core.setOutput('head', context.eventName === 'pull_request'
            ? context.payload.pull_request.head.sha
            : context.sha);

    - name: TruffleHog OSS (push/pr diff)
      if: github.event_name != 'schedule'
      uses: trufflesecurity/trufflehog@7635b24fd512a2e817dd3e9dd661caaf035a079d # v3.93.1
      with:
        path: ./
        base: ${{ steps.trufflehog-diff.outputs.base }}
        head: ${{ steps.trufflehog-diff.outputs.head }}
        extra_args: --debug --only-verified

    - name: TruffleHog OSS (scheduled full scan)
      if: github.event_name == 'schedule'
      uses: trufflesecurity/trufflehog@7635b24fd512a2e817dd3e9dd661caaf035a079d # v3.93.1
      with:
        path: ./
        extra_args: --debug --only-verified

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      matrix:
        language: [ 'python', 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Install CycloneDX tools
      run: pip install cyclonedx-bom==7.2.1

    - name: Generate Backend SBOM
      run: |
        cyclonedx-py requirements requirements.lock --output-file sbom-backend.json

    - name: Generate Internal Service Asset SBOM
      run: |
        python scripts/generate_service_asset_sbom.py --output sbom-services.json

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'

    - name: Generate Frontend SBOM
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        CHROMEDRIVER_SKIP_DOWNLOAD: true
      run: |
        cd frontend
        npm ci
        npx --no-install cyclonedx-npm --package-lock-only --output-file ../sbom-frontend.json

    - name: Upload SBOMs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: sbom-reports
        path: |
          sbom-backend.json
          sbom-frontend.json
          sbom-services.json
        if-no-files-found: error

  artifact-signing:
    name: Artifact Signing (Cosign)
    needs: [sbom]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Download SBOM artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: sbom-reports
        path: .

    - name: Install Cosign
      uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

    - name: Sign SBOM artifacts (keyless OIDC)
      run: |
        set -euo pipefail
        cosign version
        test -f sbom-backend.json
        test -f sbom-frontend.json
        test -f sbom-services.json
        cosign sign-blob --yes sbom-backend.json \
          --bundle sbom-backend.sigstore.json
        cosign sign-blob --yes sbom-frontend.json \
          --bundle sbom-frontend.sigstore.json
        cosign sign-blob --yes sbom-services.json \
          --bundle sbom-services.sigstore.json

    - name: Verify SBOM signatures
      run: |
        set -euo pipefail
        IDENTITY='^https://github.com/kherrera6219/DataLogicEngine/.github/workflows/security.yml@refs/heads/main$'
        ISSUER='https://token.actions.githubusercontent.com'
        cosign verify-blob sbom-backend.json \
          --bundle sbom-backend.sigstore.json \
          --certificate-identity-regexp "$IDENTITY" \
          --certificate-oidc-issuer "$ISSUER"
        cosign verify-blob sbom-frontend.json \
          --bundle sbom-frontend.sigstore.json \
          --certificate-identity-regexp "$IDENTITY" \
          --certificate-oidc-issuer "$ISSUER"
        cosign verify-blob sbom-services.json \
          --bundle sbom-services.sigstore.json \
          --certificate-identity-regexp "$IDENTITY" \
          --certificate-oidc-issuer "$ISSUER"

    - name: Upload signing artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: sbom-signatures
        path: |
          sbom-backend.sigstore.json
          sbom-frontend.sigstore.json
          sbom-services.sigstore.json
        if-no-files-found: error

  crash-reporting-probe:
    name: Crash Reporting Probe
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --require-hashes -r requirements.lock

    - name: Check crash reporting configuration
      id: crash-reporting-config
      env:
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      run: |
        if [ -n "$SENTRY_DSN" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::notice::SENTRY_DSN is not configured; skipping crash-reporting probe."
        fi

    - name: Send Sentry probe event
      if: steps.crash-reporting-config.outputs.configured == 'true'
      env:
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        DLE_EXTERNAL_TELEMETRY_ENABLED: "true"
        FLASK_ENV: "production"
        APP_VERSION: "security-workflow-probe"
      run: |
        python scripts/send_sentry_test_event.py --message "DataLogicEngine security workflow crash probe" --tag source=security --tag workflow=security
