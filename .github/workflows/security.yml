name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety pip-audit

    - name: Run Safety check
      run: |
        safety check --json --output safety-report.json || true
        cat safety-report.json

    - name: Run pip-audit
      run: |
        pip-audit --desc --format json || true

    - name: Upload Safety report
      uses: actions/upload-artifact@v4
      with:
        name: safety-report
        path: safety-report.json

  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run npm audit
      run: |
        npm audit --json > npm-audit.json || true
        cat npm-audit.json

    - name: Upload npm audit report
      uses: actions/upload-artifact@v4
      with:
        name: npm-audit-report
        path: npm-audit.json

  code-security:
    name: Code Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install bandit
      run: pip install bandit[toml]

    - name: Run Bandit security scan
      run: |
        bandit -r backend/ core/ -f json -o bandit-report.json || true
        bandit -r backend/ core/ -f screen || true

    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.json

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: TruffleHog OSS
      uses: trufflesecurity/trufflehog@main
      continue-on-error: true
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
        extra_args: --debug --only-verified

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      matrix:
        language: [ 'python', 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install CycloneDX tools
      run: pip install cyclonedx-bom

    - name: Generate Backend SBOM
      run: |
        if [ -f requirements-enterprise.txt ]; then
          cyclonedx-py requirements requirements-enterprise.txt --output sbom-backend.json
        else
          cyclonedx-py requirements requirements.txt --output sbom-backend.json
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate Frontend SBOM
      run: |
        if [ -d frontend ]; then
          cd frontend
          npm install --package-lock-only || true
          npx @cyclonedx/cyclonedx-npm --output-file ../sbom-frontend.json || true
        fi

    - name: Upload SBOMs
      uses: actions/upload-artifact@v4
      with:
        name: sbom-reports
        path: |
          sbom-backend.json
          sbom-frontend.json

  artifact-signing:
    name: Artifact Signing (Cosign)
    needs: [sbom]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Install Cosign
      uses: sigstore/cosign-installer@v3.1.1
    
    - name: Write signing key (MOCK)
      run: echo "Artifact signing would occur here using stored GitHub secrets"
