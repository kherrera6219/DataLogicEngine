---
# Universal Knowledge Graph (UKG) System - Quad Persona Configuration

# General quad persona engine settings
engine:
  max_recursive_passes: 3
  min_confidence_threshold: 0.7
  enable_memory_integration: true
  default_persona_weights:
    knowledge: 1.0
    sector: 1.0
    regulatory: 1.0
    compliance: 1.0

# Memory management settings
memory:
  working_memory_capacity: 20
  enable_semantic_search: false # Set to true if using embedding-based search
  max_memory_age_days: 30
  salience_decay_rate: 0.1

# Refinement workflow settings
refinement:
  enable_refinement: true
  min_refinement_confidence: 0.6
  refinement_steps:
    - id: initial_analysis
      optional: false
      threshold: 0.0
    - id: knowledge_processing
      optional: false
      threshold: 0.0
    - id: sector_processing
      optional: false
      threshold: 0.0
    - id: regulatory_processing
      optional: false
      threshold: 0.0
    - id: compliance_processing
      optional: false
      threshold: 0.0
    - id: cross_persona_analysis
      optional: false
      threshold: 0.0
    - id: conflict_resolution
      optional: true
      threshold: 0.0
    - id: confidence_assessment
      optional: false
      threshold: 0.0
    - id: refinement_pass
      optional: true
      threshold: 0.6
    - id: fact_verification
      optional: true
      threshold: 0.7
    - id: coherence_check
      optional: false
      threshold: 0.0
    - id: final_synthesis
      optional: false
      threshold: 0.0

# Axis mapping settings
axis_mapping:
  dominant_axes:
    - 8 # Knowledge Expert
    - 9 # Sector Expert
    - 10 # Regulatory Expert (Octopus Node)
    - 11 # Compliance Expert (Spiderweb Node)
  influencing_axes:
    - 1 # Knowledge Framework (Pillar Levels)
    - 2 # Sectors
    - 3 # Domains
    - 4 # Methods
    - 5 # Temporal Context
    - 6 # Regulatory
    - 7 # Compliance

# Domain-specific settings
domains:
  healthcare:
    relevant_personas:
      knowledge: ["healthcare_knowledge_expert"]
      sector: ["healthcare_sector_expert"]
      regulatory: ["healthcare_regulatory_expert"]
      compliance: ["healthcare_compliance_expert"]
    regulations:
      - "HIPAA"
      - "FDA Medical Device Regulations"
      - "HITECH Act"
      - "21st Century Cures Act"
    standards:
      - "HL7 FHIR"
      - "ICD-10"
      - "DICOM"

  finance:
    relevant_personas:
      knowledge: ["finance_knowledge_expert"]
      sector: ["finance_sector_expert"]
      regulatory: ["finance_regulatory_expert"]
      compliance: ["finance_compliance_expert"]
    regulations:
      - "Dodd-Frank Act"
      - "Basel Accords"
      - "SEC Regulations"
      - "Anti-Money Laundering Laws"
    standards:
      - "PCI DSS"
      - "SWIFT Standards"
      - "ISO 20022"

  technology:
    relevant_personas:
      knowledge: ["technology_knowledge_expert"]
      sector: ["technology_sector_expert"]
      regulatory: ["technology_regulatory_expert"]
      compliance: ["technology_compliance_expert"]
    regulations:
      - "GDPR"
      - "CCPA/CPRA"
      - "NIST Cybersecurity Framework"
      - "Export Control Regulations"
    standards:
      - "ISO 27001"
      - "NIST 800-53"
      - "SOC 2"

  defense:
    relevant_personas:
      knowledge: ["defense_knowledge_expert"]
      sector: ["defense_sector_expert"]
      regulatory: ["defense_regulatory_expert"]
      compliance: ["defense_compliance_expert"]
    regulations:
      - "ITAR"
      - "EAR"
      - "FAR/DFARS"
      - "DoD 5000 Series"
    standards:
      - "MIL-STD"
      - "AS9100"
      - "NIST 800-171"
      - "CMMC"
    high_assurance: true

# Persona Scaling Configuration
persona_scaling:
  enabled: true
  trigger_after_step: 3 # After base quad, before synthesis

  # Threshold configurations
  thresholds:
    standard:
      complexity: 60
      stakes: 40
      conflict: 0.2
      coverage: 0.85
    high_assurance:
      complexity: 40
      stakes: 30
      conflict: 0.1
      coverage: 0.95

  # Pod spawn caps
  pod_caps:
    knowledge_max: 6
    sector_max: 6
    regulatory_max: 3
    compliance_max: 3

  # Keywords that trigger high-assurance mode
  high_assurance_keywords:
    defense:
      - "weapon"
      - "military"
      - "defense"
      - "dod"
      - "classified"
      - "fighter"
      - "bomber"
      - "missile"
      - "f-22"
      - "f-35"
      - "b-21"
    safety_critical:
      - "safety"
      - "safety-critical"
      - "airworthiness"
      - "do-178"
      - "do-254"
      - "hazard"
      - "catastrophic"
    export_control:
      - "itar"
      - "ear"
      - "export control"
      - "export license"
      - "technology control"
    major_program:
      - "modernization"
      - "upgrade"
      - "fielding"
      - "acquisition"
      - "milestone"

  # Pod definitions with example personas
  pods:
    knowledge:
      description: "Technical domain experts for subsystems"
      examples:
        - id: radar_sme
          name: "Radar Systems SME"
          domain: "avionics"
        - id: ew_sme
          name: "Electronic Warfare SME"
          domain: "avionics"
        - id: avionics_sme
          name: "Mission Computer / Avionics SME"
          domain: "avionics"
        - id: propulsion_sme
          name: "Propulsion SME"
          domain: "propulsion"
        - id: structures_sme
          name: "Airframe Structures SME"
          domain: "structures"
        - id: software_sme
          name: "Software / Integration SME"
          domain: "software"

    sector:
      description: "Industry and operations experts"
      examples:
        - id: program_sme
          name: "Program Execution (Cost/Schedule)"
          domain: "program_management"
        - id: sustainment_sme
          name: "Sustainment / Depot / Readiness"
          domain: "sustainment"
        - id: manufacturing_sme
          name: "Manufacturing / Supply Chain"
          domain: "manufacturing"
        - id: operations_sme
          name: "Operational User (Tactics)"
          domain: "operations"
        - id: cyber_sme
          name: "Cyber Operations / Mission Assurance"
          domain: "cybersecurity"
        - id: systems_eng_sme
          name: "Systems Engineering / Integration Lead"
          domain: "systems_engineering"

    regulatory:
      description: "Regulatory framework experts"
      examples:
        - id: airworthiness_sme
          name: "Airworthiness / Safety Authority"
          domain: "regulatory"
        - id: export_sme
          name: "Export Controls / ITAR"
          domain: "regulatory"
        - id: contracting_sme
          name: "Contracting / FAR-DFARS"
          domain: "regulatory"

    compliance:
      description: "Compliance and standards experts"
      examples:
        - id: rmf_sme
          name: "Security Compliance (RMF/ATO)"
          domain: "compliance"
        - id: quality_sme
          name: "Quality Compliance (AS9100)"
          domain: "compliance"
        - id: config_sme
          name: "Configuration Management / Data Gov"
          domain: "compliance"

  # Orchestration settings
  orchestration:
    max_workers: 4
    max_deconfliction_passes: 3
    confidence_threshold: 0.995
    parallel_pod_processing: true
    within_pod_synthesis: true
    cross_pod_deconfliction: true
