[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ukg-sdk"
version = "0.6.0"
description = "Thin Python clients for the installed DataLogicEngine governed API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# A14-8: aiohttp and tenacity are used at runtime by providers/local_slm.py and
# providers/openai.py respectively and must be declared as hard dependencies.
# Provider vendor SDKs are optional extras so callers pay only for what they use.
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
    "aiohttp>=3.9,<4",
    "tenacity>=8,<10",
]

[project.optional-dependencies]
openai = ["openai>=1.30,<2"]
anthropicai = ["anthropic>=0.25,<1"]
google = ["google-generativeai>=0.5,<1"]
all = [
    "openai>=1.30,<2",
    "anthropic>=0.25,<1",
    "google-generativeai>=0.5,<1",
]

[project.urls]
"Homepage" = "https://github.com/kherrera6219/DataLogicEngine"

[tool.hatch.build.targets.wheel]
packages = ["ukg_sdk"]
