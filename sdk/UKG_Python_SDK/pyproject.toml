[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ukg-sdk"
version = "0.5.0"
description = "UKG SDK: public API overlay for LLMs with KA execution hooks, 17-axis resolver, memory/audit adapters"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="UKG/USKD Core"}]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
postgres = [
  "asyncpg>=0.29,<1",
]
redis = [
  "redis>=5,<9",
]
registries = [
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[tool.setuptools.package-data]
ukg_sdk = ["data/*", "data/audit/*", "data/dsqp_templates/*"]
