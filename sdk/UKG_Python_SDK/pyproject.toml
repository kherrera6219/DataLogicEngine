[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ukg-sdk"
version = "0.7.0"
description = "Thin Python clients for the installed DataLogicEngine governed API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
]

[project.urls]
"Homepage" = "https://github.com/kherrera6219/DataLogicEngine"

[tool.hatch.build.targets.wheel]
packages = ["ukg_sdk"]
