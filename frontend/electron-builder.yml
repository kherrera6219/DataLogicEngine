appId: com.ukg.datalogicengine
productName: DataLogicEngine Desktop
copyright: Copyright © 2026 Kevin Herrera
directories:
  output: dist
  buildResources: build
files:
  - "dist-electron"
  - "out"
  - "package.json"
extraResources:
  - from: ../dist/DataLogic_Backend
    to: backend
    filter:
      - "**/*"
  - from: ../scripts/windows
    to: scripts
    filter:
      - "*.ps1"
  - from: ../policies
    to: policies
    filter:
      - "*.rego"
  - from: ../databases/jre
    to: backend/databases/jre
    filter:
      - "**/*"
win:
  target:
    - nsis
  icon: public/icon.png
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "DataLogicEngine"
  uninstallDisplayName: "DataLogicEngine Desktop"
  artifactName: "DataLogicEngine Setup Latest.exe"
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  include: electron/installer.nsh
