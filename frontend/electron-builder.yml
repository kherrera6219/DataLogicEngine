appId: com.ukg.datalogicengine
productName: DataLogicEngine Desktop
directories:
  output: dist
  buildResources: build
files:
  - "dist-electron"
  - "out"
  - "package.json"
  # - electron-builder.yml
extraResources:
  - from: ../dist/DataLogic_Backend
    to: backend
    filter:
      - "**/*"
win:
  target: dir
  # target: nsis # Disabled due to winCodeSign privilege issues
  icon: public/favicon.ico
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
