appId: com.ukg.datalogicengine
productName: DataLogicEngine Desktop
copyright: Copyright © 2026 Kevin Herrera
directories:
  output: dist
  buildResources: build
files:
  - "dist-electron"
  - "out"
  - "package.json"
extraResources:
  - from: ../dist/DataLogic_Backend
    to: backend
    filter:
      - "**/*"
  - from: ../policies
    to: policies
    filter:
      - "*.rego"
  - from: ../config/release-trust-policy.json
    to: config/release-trust-policy.json
  - from: ../config/release-channel.json
    to: config/release-channel.json

win:
  target:
    - nsis
  icon: public/icon.png
  verifyUpdateCodeSignature: true
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "DataLogicEngine"
  uninstallDisplayName: "DataLogicEngine Desktop"
  artifactName: "DataLogicEngine Setup ${version}.${ext}"
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  include: electron/installer.nsh
