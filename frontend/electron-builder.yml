appId: com.ukg.datalogicengine
productName: DataLogicEngine Desktop
directories:
  output: dist
  buildResources: build
files:
  - "dist-electron"
  - "out"
  - "package.json"
extraResources:
  - from: ../dist/DataLogic_Backend
    to: backend
    filter:
      - "**/*"
  - from: ../scripts/windows
    to: scripts
    filter:
      - "*.ps1"
win:
  target:
    - nsis
  icon: public/icon.png
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "DataLogicEngine"
  artifactName: "DataLogicEngine Setup ${version}.exe"
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  include: electron/installer.nsh
