appId: com.ukg.datalogicengine
productName: DataLogicEngine Desktop
directories:
  output: dist
  buildResources: build
files:
  - "dist-electron"
  - "out"
  - "package.json"
  # - electron-builder.yml
extraResources:
  - from: ../dist/DataLogic_Backend
    to: backend
    filter:
      - "**/*"
win:
  target:
    - nsis
    - portable
  icon: public/favicon.ico
  verifyUpdateCodeSignature: false
  publisherName: "UKG"
nsis:
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "DataLogicEngine"
  artifactName: "${productName} Setup ${version}.${ext}"
  deleteAppDataOnUninstall: false # Managed by our custom uninstall.ps1
