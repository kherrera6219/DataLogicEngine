apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: traceruns.ukg.io
spec:
  group: ukg.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                query:
                  type: string
                tier:
                  type: string
                  enum: ["trivial", "moderate", "high_stakes", "extreme"]
                sessionId:
                  type: string
                userId:
                  type: string
                context:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Running", "Completed", "Failed", "Vetoed"]
                confidence:
                  type: number
                completionTime:
                  type: string
                  format: date-time
                resultsSummary:
                  type: string
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: traceruns
    singular: tracerun
    kind: TraceRun
    shortNames:
    - tr
