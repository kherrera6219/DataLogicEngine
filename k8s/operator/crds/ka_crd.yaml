apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: knowledgealgorithms.ukg.io
spec:
  group: ukg.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                kaId:
                  type: string
                  description: "The unique identifier for the Knowledge Algorithm (e.g., KA-038)"
                image:
                  type: string
                  description: "Container image for the KA worker"
                replicas:
                  type: integer
                  minimum: 1
                scaling:
                  type: object
                  properties:
                    minReplicas:
                      type: integer
                    maxReplicas:
                      type: integer
                    queueName:
                      type: string
                    targetQueueDepth:
                      type: integer
                config:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                availableReplicas:
                  type: integer
                phase:
                  type: string
                lastSyncTime:
                  type: string
                  format: date-time
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: knowledgealgorithms
    singular: knowledgealgorithm
    kind: KnowledgeAlgorithm
    shortNames:
      - ka
