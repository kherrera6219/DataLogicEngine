apiVersion: apps/v1
kind: Deployment
metadata:
  name: ukg-operator
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ukg-operator
  template:
    metadata:
      labels:
        app: ukg-operator
    spec:
      serviceAccountName: ukg-operator-sa
      containers:
      - name: operator
        image: ukg-backend:latest # Reuses backend image with kopf installed
        command: ["kopf", "run", "-A", "backend/operator/operator.py"]
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
