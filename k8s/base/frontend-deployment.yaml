apiVersion: apps/v1
kind: Deployment
metadata:
  name: ukg-frontend
  labels:
    app: ukg-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ukg-frontend
  template:
    metadata:
      labels:
        app: ukg-frontend
    spec:
      containers:
      - name: frontend
        image: ukg-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://ukg-backend-service"
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ukg-frontend-service
spec:
  selector:
    app: ukg-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
