apiVersion: apps/v1
kind: Deployment
metadata:
  name: ukg-backend
  labels:
    app: ukg-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ukg-backend
  template:
    metadata:
      labels:
        app: ukg-backend
    spec:
      containers:
      - name: backend
        image: ukg-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ukg-secrets
              key: database-url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ukg-secrets
              key: openai-api-key
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ukg-backend-service
spec:
  selector:
    app: ukg-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP
