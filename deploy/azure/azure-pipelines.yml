trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established in Azure Pipelines
  dockerRegistryServiceConnection: 'ukg-acr-connection'
  imageRepository: 'ukg-backend'
  containerRegistry: 'ukgregistry.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/backend/Dockerfile'
  tag: '$(Build.BuildId)'
  
  # Azure Web App Name
  webAppName: 'ukg-enterprise-app'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: Deploy
    displayName: Deploy
    environment: 'production'
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: 'Azure Web App on Container Deploy'
            inputs:
              azureSubscription: 'AzureSubscription'
              appName: $(webAppName)
              containers: $(containerRegistry)/$(imageRepository):$(tag)
              configurationSettings: |
                FLASK_ENV=production
                WEBSITES_PORT=5000
