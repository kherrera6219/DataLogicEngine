<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ title }} - DataLogicEngine</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 8px; overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .content { padding: 30px; }
        .notification { padding: 20px; border-radius: 8px; margin: 10px 0; }
        .notification.info { background: #d1ecf1; border-left: 4px solid #17a2b8; }
        .notification.success { background: #d4edda; border-left: 4px solid #28a745; }
        .notification.warning { background: #fff3cd; border-left: 4px solid #ffc107; }
        .notification.error { background: #f8d7da; border-left: 4px solid #dc3545; }
        .footer { padding: 20px; text-align: center; color: #666; font-size: 12px; background: #f9f9f9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ title }}</h1>
        </div>
        <div class="content">
            <div class="notification {{ type }}">
                {{ message }}
            </div>
        </div>
        <div class="footer">
            <p>&copy; 2026 DataLogicEngine. All rights reserved.</p>
            <p><a href="https://datalogicengine.com/settings">Manage notification preferences</a></p>
        </div>
    </div>
</body>
</html>
