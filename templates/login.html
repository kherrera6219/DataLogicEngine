{% extends 'base.html' %}

{% block title %}Universal Knowledge Graph - Login{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Log in to access the Universal Knowledge Graph system</p>
        </div>
        
        <div class="auth-body">
            <form action="{{ url_for('auth.login') }}" method="POST" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                
                <div class="form-group form-check">
                    <input type="checkbox" id="remember" name="remember" class="form-check-input">
                    <label for="remember" class="form-check-label">Remember me</label>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block">Log In</button>
                </div>
            </form>
            
            <div class="social-login">
                <div class="divider">
                    <span>or</span>
                </div>
                <a href="{{ url_for('replit_auth.login') }}" class="btn btn-replit btn-block">
                    <svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor" style="margin-right: 8px;">
                        <path d="M7 5.5C7 4.67157 7.67157 4 8.5 4H15.5C16.3284 4 17 4.67157 17 5.5V12H8.5C7.67157 12 7 11.3284 7 10.5V5.5Z"/>
                        <path d="M17 12H25.5C26.3284 12 27 12.6716 27 13.5V18.5C27 19.3284 26.3284 20 25.5 20H17V12Z"/>
                        <path d="M7 21.5C7 20.6716 7.67157 20 8.5 20H17V26.5C17 27.3284 16.3284 28 15.5 28H8.5C7.67157 28 7 27.3284 7 26.5V21.5Z"/>
                    </svg>
                    Continue with Replit
                </a>
            </div>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
            </div>
        </div>
    </div>
</div>

<style>
    /* Authentication Pages Styles */
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
    }
    
    .auth-card {
        background-color: var(--dark-bg-secondary);
        border-radius: var(--border-radius);
        box-shadow: 0 8px 24px var(--dark-shadow);
        width: 100%;
        max-width: 450px;
        overflow: hidden;
    }
    
    .light-theme .auth-card {
        background-color: var(--light-bg-secondary);
        box-shadow: 0 8px 24px var(--light-shadow);
    }
    
    .auth-header {
        padding: 2rem;
        text-align: center;
        border-bottom: 1px solid var(--dark-border);
    }
    
    .light-theme .auth-header {
        border-bottom: 1px solid var(--light-border);
    }
    
    .auth-title {
        font-size: 1.75rem;
        margin-bottom: 0.75rem;
    }
    
    .auth-subtitle {
        color: var(--dark-text-secondary);
        margin-bottom: 0;
    }
    
    .light-theme .auth-subtitle {
        color: var(--light-text-secondary);
    }
    
    .auth-body {
        padding: 2rem;
    }
    
    .auth-form {
        margin-bottom: 1.5rem;
    }
    
    .form-check {
        display: flex;
        align-items: center;
        margin-bottom: 1.5rem;
    }
    
    .form-check-input {
        margin-right: 0.5rem;
    }
    
    .form-check-label {
        font-size: 0.95rem;
        user-select: none;
    }
    
    .btn-block {
        width: 100%;
        padding: 0.75rem 1rem;
        font-size: 1rem;
    }
    
    .auth-footer {
        text-align: center;
        padding-top: 1rem;
        border-top: 1px solid var(--dark-border);
        margin-top: 1rem;
    }
    
    .light-theme .auth-footer {
        border-top: 1px solid var(--light-border);
    }
    
    .auth-footer p {
        margin-bottom: 0;
        font-size: 0.95rem;
    }
    
    /* Desktop - larger screens */
    @media (min-width: 1200px) {
        .auth-container {
            min-height: 75vh;
        }
        
        .auth-card {
            max-width: 500px;
            padding: 0;
        }
        
        .auth-header {
            padding: 2.5rem 3rem;
        }
        
        .auth-body {
            padding: 2.5rem 3rem;
        }
        
        .auth-title {
            font-size: 2rem;
        }
    }
    
    /* Tablet - medium screens */
    @media (min-width: 768px) and (max-width: 1199px) {
        .auth-container {
            min-height: 65vh;
            padding: 2rem;
        }
        
        .auth-card {
            max-width: 480px;
        }
        
        .auth-header {
            padding: 2rem 2.5rem;
        }
        
        .auth-body {
            padding: 2rem 2.5rem;
        }
    }
    
    /* Mobile - small screens */
    @media (max-width: 767px) {
        .auth-container {
            padding: 1rem;
            min-height: 60vh;
        }
        
        .auth-card {
            margin: 0;
            max-width: 100%;
        }
        
        .auth-header {
            padding: 1.5rem 1.25rem;
        }
        
        .auth-title {
            font-size: 1.5rem;
        }
        
        .auth-body {
            padding: 1.5rem 1.25rem;
        }
    }
    
    @media (max-width: 480px) {
        .auth-header {
            padding: 1.25rem 1rem;
        }
        
        .auth-body {
            padding: 1.25rem 1rem;
        }
        
        .auth-title {
            font-size: 1.35rem;
        }
    }
    
    /* Social login styles */
    .social-login {
        margin-top: 1.5rem;
    }
    
    .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 1rem 0;
    }
    
    .divider::before,
    .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid var(--dark-border);
    }
    
    .light-theme .divider::before,
    .light-theme .divider::after {
        border-bottom-color: var(--light-border);
    }
    
    .divider span {
        padding: 0 1rem;
        color: var(--dark-text-secondary);
        font-size: 0.875rem;
    }
    
    .light-theme .divider span {
        color: var(--light-text-secondary);
    }
    
    .btn-replit {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0D101E;
        color: #F5F9FC;
        border: 1px solid #3D4152;
        padding: 0.75rem 1rem;
        font-size: 1rem;
        transition: all 0.2s ease;
    }
    
    .btn-replit:hover {
        background-color: #1C2333;
        border-color: #5C6BC0;
        color: #F5F9FC;
        text-decoration: none;
    }
    
    .light-theme .btn-replit {
        background-color: #F5F9FC;
        color: #0D101E;
        border-color: #D0D7DE;
    }
    
    .light-theme .btn-replit:hover {
        background-color: #E8EEF2;
        border-color: #5C6BC0;
    }
</style>
{% endblock %}
