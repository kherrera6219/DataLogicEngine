{% extends 'base.html' %}

{% block title %}Universal Knowledge Graph - Verify 2FA{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2 class="auth-title">Two-Factor Authentication</h2>
            <p class="auth-subtitle">Please enter the code from your authenticator app</p>
        </div>
        
        <div class="auth-body">
            <form action="{{ url_for('auth.mfa_verify') }}" method="POST" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="form-group">
                    <label for="token" class="form-label">Authentication Code</label>
                    <input type="text" id="token" name="token" class="form-control" placeholder="Enter 6-digit code" required autocomplete="off" autofocus>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block">Verify</button>
                </div>
            </form>
            
            <div class="auth-footer text-center mt-3">
                <p><a href="{{ url_for('auth.logout') }}">Return to Login</a></p>
            </div>
        </div>
    </div>
</div>

<style>
    /* Reuse auth styles */
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
    }
    
    .auth-card {
        background-color: var(--dark-bg-secondary);
        border-radius: var(--border-radius);
        box-shadow: 0 8px 24px var(--dark-shadow);
        width: 100%;
        max-width: 450px;
        overflow: hidden;
    }
    
    .light-theme .auth-card {
        background-color: var(--light-bg-secondary);
        box-shadow: 0 8px 24px var(--light-shadow);
    }
    
    .auth-header {
        padding: 2rem;
        text-align: center;
        border-bottom: 1px solid var(--dark-border);
    }
    
    .light-theme .auth-header {
        border-bottom: 1px solid var(--light-border);
    }
    
    .auth-title {
        font-size: 1.75rem;
        margin-bottom: 0.75rem;
    }
    
    .auth-subtitle {
        color: var(--dark-text-secondary);
        margin-bottom: 0;
    }
    
    .light-theme .auth-subtitle {
        color: var(--light-text-secondary);
    }
    
    .auth-body {
        padding: 2rem;
    }
    
    .auth-form {
        margin-bottom: 1.5rem;
    }
    
    .btn-block {
        width: 100%;
        padding: 0.75rem 1rem;
        font-size: 1rem;
    }
</style>
{% endblock %}
