[project]
name = "datalogicengine"
version = "0.1.0"
description = "DataLogicEngine backend and repository tooling workspace"
requires-python = ">=3.11"
# Runtime installs are standardized on requirements.txt in CI and onboarding docs.
# Keep this dependency list aligned enough for editable installs and uv metadata.
dependencies = [
    "email-validator>=2.3.0",
    "flask-migrate>=4.1.0",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=24.1.1",
    "markdown>=3.8.1",
    "networkx>=3.6.1",
    "psycopg2-binary>=2.9.12",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.50",
    "flask-cors>=6.0.2",
    "marshmallow>=3.26.2,<4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "flask-swagger-ui>=5.32.6",
    "flask-login>=0.6.3",
    "oauthlib>=3.3.1",
    "pyjwt>=2.13.0",
    "python-json-logger>=3.3.0",
    "flask-dance>=7.1.0",
    "openai>=2.41.0",
    "numpy>=2.4.6",
    "tabulate>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*:",
    "ignore:websockets\\.legacy is deprecated.*:DeprecationWarning:websockets\\.legacy:",
    "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated.*:DeprecationWarning:flask_login\\.login_manager:",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["backend", "."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "*/migrations/*",
    "*/config.py",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
