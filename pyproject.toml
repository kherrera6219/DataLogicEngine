[project]
name = "datalogicengine"
version = "0.1.0"
description = "DataLogicEngine backend and repository tooling workspace"
requires-python = ">=3.11"
# Runtime installs are standardized on requirements.txt in CI and onboarding docs.
# Keep this dependency list aligned enough for editable installs and uv metadata.
dependencies = [
    "email-validator>=2.2.0",
    "flask-migrate>=4.1.0",
    "flask>=3.1.2",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "markdown>=3.8",
    "networkx>=3.4.2",
    "psycopg2-binary>=2.9.10",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.41",
    "flask-cors>=6.0.2",
    "marshmallow>=4.1.2",
    "python-dotenv>=1.1.0",
    "requests>=2.32.5",
    "flask-swagger-ui>=5.21.0",
    "flask-login>=0.6.3",
    "oauthlib>=3.3.1",
    "pyjwt>=2.10.1",
    "python-json-logger>=3.3.0",
    "flask-dance>=7.1.0",
    "openai>=1.79.0",
    "numpy>=2.2.6",
    "tabulate>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*:",
]
# Code coverage settings
addopts = """
    --cov=backend
    --cov=models
    --cov-report=html
    --cov-report=term-missing
    --cov-report=json
    --cov-fail-under=70
"""
testpaths = ["tests"]

[tool.coverage.run]
source = ["backend", "."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "*/migrations/*",
    "*/config.py",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
