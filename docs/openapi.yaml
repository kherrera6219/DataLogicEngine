openapi: 3.0.3
info:
  title: DataLogicEngine API
  description: >
    Current partial REST contract for the local-first DataLogicEngine desktop
    application. The live app uses single-owner OS-level desktop auth, Flask
    sessions, CSRF protection, and copy-once client keys for the explicitly
    versioned gateway surface. Removed web login/register/MFA/SSO routes are intentionally
    not part of this contract.
  version: 3.5.1
  contact:
    name: DataLogicEngine Support
    url: https://github.com/kherrera6219/DataLogicEngine/issues

servers:
  - url: http://localhost:5000/api/v1
    description: Local development or Electron loopback API

tags:
  - name: Authentication
    description: Desktop single-owner auth and CSRF helpers.
  - name: LLM Gateway
    description: User-selected OpenAI or Google/Gemini cloud model execution.
  - name: Truth Engine
    description: Truth Engine sessions, gate checks, memory, and event surfaces.
  - name: Knowledge Algorithms
    description: KA registry, workflow execution, and trace helpers.
  - name: Settings
    description: User AI preference and model-provider configuration.
  - name: Search
    description: Global search and suggestions.
  - name: Ingestion
    description: Local-first knowledge ingestion.
  - name: Dataset Preparation
    description: Owner-only candidate dataset export, measured evaluation, and training-admission records.
  - name: Memory
    description: Owner-only UnifiedMemory review and lifecycle controls.
  - name: Tracing
    description: Run/session trace review and export bundles.
  - name: Operations
    description: Health and readiness endpoints.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Flask-Login session cookie established by desktop auto-login.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token issued by GET /auth/csrf-token for mutating requests.
    desktopTrustHeader:
      type: apiKey
      in: header
      name: X-DataLogic-Desktop
      description: Desktop loopback trust header used by Electron challenge/auto-login.
    clientBearer:
      type: http
      scheme: bearer
      bearerFormat: ukg_<copy-once-client-key>
    clientApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Copy-once client key. Bearer authentication is preferred.
  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
        error:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        code:
          type: string
          nullable: true
      additionalProperties: true
    TrainingAdmissionRequest:
      type: object
      additionalProperties: false
      required:
        - artifact_name
        - export_type
        - model_name
        - epochs
        - parameter_space
      properties:
        artifact_name:
          type: string
          description: File name of an existing artifact below the app-owned runtime dataset directory.
        export_type:
          type: string
          enum: [sft, dpo, prm]
        model_name:
          type: string
          minLength: 1
          maxLength: 200
        epochs:
          type: integer
          minimum: 1
          maximum: 100
        hyperparameters:
          type: object
          additionalProperties: true
        parameter_space:
          type: object
          minProperties: 1
          additionalProperties:
            type: array
            minItems: 1
            items: {}
        tuning_observations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [params, score, sample_count]
            properties:
              params:
                type: object
                additionalProperties: true
              score:
                type: number
                minimum: 0
                maximum: 1
              sample_count:
                type: integer
                minimum: 1
    ModelEvaluationRequest:
      type: object
      additionalProperties: false
      required: [model_id, test_set, predictions, labels]
      properties:
        model_id:
          type: string
          minLength: 1
          maxLength: 200
        test_set:
          type: string
          minLength: 1
          maxLength: 200
        predictions:
          type: array
          minItems: 1
          items: {}
        labels:
          type: array
          minItems: 1
          items: {}
        acceptance_accuracy:
          type: number
          minimum: 0
          maximum: 1
          default: 0.8
    KAProductRun:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - run_id
        - request_id
        - canonical_id
        - manifest_version
        - status
        - mode
        - risk_tier
        - confirmation_required
        - confirmed
      properties:
        schema_version:
          type: string
          enum: [dle.ka-product-run.v1]
        run_id:
          type: string
          format: uuid
        request_id:
          type: string
        canonical_id:
          type: string
        manifest_version:
          type: string
        status:
          type: string
          enum:
            - planned
            - queued
            - running
            - succeeded
            - partial
            - blocked
            - failed
            - cancelled
            - timed_out
            - dry_run
            - expired
        mode:
          type: string
          enum: [production, evaluation, dry_run]
        risk_tier:
          type: string
          enum: [read_only, write, destructive]
        confirmation_required:
          type: boolean
        confirmed:
          type: boolean
        cancellation_requested:
          type: boolean
        result_size_bytes:
          type: integer
          nullable: true
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
        status_url:
          type: string
        execute_url:
          type: string
        cancel_url:
          type: string
        result_url:
          type: string
        trace_url:
          type: string
        artifacts_url:
          type: string
        effects_url:
          type: string
    KAProductPlanRequest:
      type: object
      additionalProperties: false
      required: [ka_id, idempotency_key]
      properties:
        ka_id:
          type: string
          maxLength: 64
        input:
          type: object
          additionalProperties: true
        mode:
          type: string
          enum: [production, evaluation, dry_run]
          default: production
        request_id:
          type: string
          maxLength: 128
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
        session_id:
          type: string
          maxLength: 128
        tier:
          type: string
          maxLength: 80
        layer:
          type: string
          maxLength: 80
        persona:
          type: string
          maxLength: 80
        metadata:
          type: object
          additionalProperties: true
        budget:
          type: object
          additionalProperties:
            type: integer
    KAProductPlan:
      type: object
      additionalProperties: true
      required:
        - plan_id
        - manifest_version
        - valid
        - selected_ids
        - execution_order
        - risk
      properties:
        plan_id:
          type: string
        manifest_version:
          type: string
        valid:
          type: boolean
        validation_errors:
          type: array
          items: {type: string}
        selected_ids:
          type: array
          items: {type: string}
        execution_order:
          type: array
          items:
            type: array
            items: {type: string}
        risk:
          type: object
          additionalProperties: true
    KAProductPlanEnvelope:
      type: object
      required: [success, run, plan, confirmation_token]
      properties:
        success:
          type: boolean
        run:
          $ref: "#/components/schemas/KAProductRun"
        plan:
          $ref: "#/components/schemas/KAProductPlan"
        confirmation_token:
          type: string
          nullable: true
          description: Copy-once exact-plan confirmation value when required.
    KAProductRunEnvelope:
      type: object
      required: [success, run]
      properties:
        success:
          type: boolean
        run:
          $ref: "#/components/schemas/KAProductRun"
        plan:
          $ref: "#/components/schemas/KAProductPlan"
    AuthCheckResponse:
      allOf:
        - $ref: "#/components/schemas/StandardResponse"
        - type: object
          properties:
            authenticated:
              type: boolean
    DesktopChallengeResponse:
      allOf:
        - $ref: "#/components/schemas/StandardResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                nonce:
                  type: string
                expires_in_seconds:
                  type: integer
    ChatRequest:
      type: object
      additionalProperties: false
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required:
              - role
              - content
            properties:
              role:
                type: string
                enum:
                  - user
                  - assistant
                  - system
              content:
                oneOf:
                  - type: string
                    minLength: 1
                    maxLength: 200000
                  - type: array
                    minItems: 1
                    maxItems: 20
                    items:
                      type: object
        request_id:
          type: string
          minLength: 8
          maxLength: 128
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
          description: Synchronous-chat retry key. Reuse with a changed request returns 409 and never repeats governed work; streaming rejects it until resume semantics qualify.
        session_id:
          type: string
          minLength: 1
          maxLength: 128
          nullable: true
        virtual_model:
          type: string
          enum:
            - dle-standard
            - dle-enhanced
            - dle-local-review
        run_ukg_pipeline:
          type: boolean
          default: true
          description: Deprecated compatibility flag. False does not bypass governance.
        mode:
          type: string
          enum:
            - standard
            - enhanced
            - local_review
            - simulation
          default: standard
        provider:
          type: string
          enum:
            - openai
            - google
            - gemini
          nullable: true
          description: Requires routing:override scope and an exact server-owned provider allowlist entry.
        model:
          type: string
          nullable: true
          description: Requires routing:override scope and an exact server-owned model allowlist entry.
        constraints:
          type: object
          additionalProperties: true
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7
        max_tokens:
          type: integer
          minimum: 1
          nullable: true
        meta:
          type: object
          additionalProperties: true
      required:
        - messages
    ChatResponse:
      type: object
      properties:
        request_id:
          type: string
        response:
          type: string
        run_id:
          type: string
          nullable: true
        provider_used:
          type: string
          nullable: true
        model_used:
          type: string
          nullable: true
        contract_version:
          type: string
          example: governed.v1
        gateway_contract_version:
          type: string
          example: dle-gateway.v1
        virtual_model:
          type: string
          enum: [dle-standard, dle-enhanced, dle-local-review]
        status:
          type: string
          enum: [completed, abstained, policy_block, validation_failure, provider_failure, cancelled, internal_failure, capability_unavailable]
        confidence_score:
          type: number
          format: float
          nullable: true
          description: Versioned evidence-support coverage, not correctness probability.
        confidence_measurement:
          type: object
          nullable: true
          properties:
            formula_version:
              type: string
              example: dle-confidence.v1
            value:
              type: number
              format: float
              nullable: true
            status:
              type: string
              enum: [measured, not_measured]
            components:
              type: object
              additionalProperties:
                type: number
                nullable: true
            missing_components:
              type: array
              items:
                type: string
            explanation:
              type: string
        convergence:
          type: object
          nullable: true
          properties:
            decision_version:
              type: string
              example: dle-convergence.v1
            action:
              type: string
              enum: [finalize, refine, abstain, block]
            terminal:
              type: boolean
        claims:
          type: array
          items:
            type: object
        citations:
          type: array
          items:
            type: object
        validators:
          type: array
          items:
            type: object
        source_ids:
          type: array
          items:
            type: string
      additionalProperties: true
    GatewayError:
      type: object
      required: [error, code]
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                code:
                  type: string
                message:
                  type: string
              additionalProperties: true
        code:
          type: string
        limit:
          type: integer
        remaining:
          type: integer
        retry_after_seconds:
          type: integer
      additionalProperties: true
    GatewayCapabilities:
      type: object
      required:
        - contract_version
        - profile
        - virtual_models
        - scopes
        - provider_credentials_exposed
      properties:
        contract_version:
          type: string
          example: dle-gateway.v1
        profile:
          type: string
          enum: [desktop_loopback, same_host_gateway]
        virtual_models:
          type: object
          additionalProperties:
            type: object
        scopes:
          type: array
          items:
            type: string
        provider_credentials_exposed:
          type: boolean
          enum: [false]
      additionalProperties: false
    GatewayJob:
      type: object
      required:
        - job_id
        - request_id
        - status
        - virtual_model
        - gateway_contract_version
        - status_url
        - result_url
        - cancel_url
      properties:
        job_id:
          type: string
          format: uuid
        request_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled, expired]
        virtual_model:
          type: string
          enum: [dle-standard, dle-enhanced, dle-local-review]
        run_id:
          type: string
          format: uuid
          nullable: true
        response_status:
          type: integer
          nullable: true
        result_storage:
          type: string
          enum: [postgresql_ciphertext, minio_ciphertext]
          description: Encrypted small results remain in PostgreSQL; retained large results use the app-owned S3 store.
        result_size_bytes:
          type: integer
          nullable: true
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        cancellation_requested:
          type: boolean
        attempt_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
        gateway_contract_version:
          type: string
          enum: [dle-gateway.v1]
        status_url:
          type: string
        result_url:
          type: string
        cancel_url:
          type: string
      additionalProperties: false
    OpenAIChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          enum: [dle-standard, dle-enhanced, dle-local-review]
        messages:
          $ref: "#/components/schemas/ChatRequest/properties/messages"
        stream:
          type: boolean
          default: false
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7
        max_tokens:
          type: integer
          minimum: 1
        max_completion_tokens:
          type: integer
          minimum: 1
        n:
          type: integer
          enum: [1]
          default: 1
        user:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false
    ClientKeyMetadata:
      type: object
      required: [id, name, key_prefix, is_active, scopes]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
        is_active:
          type: boolean
        total_requests:
          type: integer
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        revoked_reason:
          type: string
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
        rotated_from_id:
          type: string
          format: uuid
          nullable: true
        scopes:
          type: array
          items:
            type: string
            enum: [chat, stream, run:create, run:read, run:cancel, trace:read, evidence:read, models:read, routing:override]
        allowed_providers:
          type: array
          items:
            type: string
        allowed_models:
          type: array
          items:
            type: string
        rate_limit_rpm:
          type: integer
        rate_limit_daily:
          type: integer
          nullable: true
        max_tokens_per_request:
          type: integer
          nullable: true
        max_concurrent_requests:
          type: integer
      additionalProperties: false
    ClientKeyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          default: [chat]
          items:
            type: string
            enum: [chat, stream, run:create, run:read, run:cancel, trace:read, evidence:read, models:read, routing:override]
        allowed_providers:
          type: array
          items:
            type: string
            enum: [openai, google]
        allowed_models:
          type: array
          items:
            type: string
        expires_in_days:
          type: integer
          minimum: 1
        rate_limit_rpm:
          type: integer
          minimum: 1
          default: 60
        rate_limit_daily:
          type: integer
          minimum: 1
        max_tokens_per_request:
          type: integer
          minimum: 1
        max_concurrent_requests:
          type: integer
          minimum: 1
          maximum: 100
          default: 2
      additionalProperties: false
    ClientKeyRotate:
      type: object
      properties:
        overlap_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 300
        name:
          type: string
          minLength: 1
          maxLength: 100
      additionalProperties: false
    AISettings:
      type: object
      properties:
        preferred_provider:
          type: string
          enum:
            - auto
            - openai
            - google
            - gemini
        preferred_model:
          type: string
          example: gemini-3.1-pro-preview
        ai_processing_enabled:
          type: boolean
        store_chat_history:
          type: boolean
      additionalProperties: true
    IngestionRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
        sync_to_neo4j:
          type: boolean
          default: false
    IngestionStatus:
      type: object
      properties:
        ingestion_id:
          type: string
        status:
          type: string
        error:
          type: string
          nullable: true
      additionalProperties: true

paths:
  /auth/check:
    get:
      summary: Check current authentication status
      tags:
        - Authentication
      responses:
        "200":
          description: Current session or desktop auth status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCheckResponse"

  /auth/csrf-token:
    get:
      summary: Issue a CSRF token
      tags:
        - Authentication
      responses:
        "200":
          description: CSRF token issued and mirrored in a cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /auth/desktop/challenge:
    post:
      summary: Issue a desktop auto-login challenge nonce
      tags:
        - Authentication
      security:
        - desktopTrustHeader: []
      responses:
        "200":
          description: One-time desktop challenge issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopChallengeResponse"
        "400":
          description: Desktop auto-login unsupported on this platform.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Desktop mode, loopback, or trust-header precondition failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/desktop/auto-login:
    post:
      summary: Complete Windows desktop auto-login
      tags:
        - Authentication
      security:
        - desktopTrustHeader: []
      parameters:
        - name: X-Desktop-Auth-Nonce
          in: header
          required: true
          schema:
            type: string
        - name: X-Desktop-Auth-Signature
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Desktop session established for the local Windows identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "403":
          description: Desktop trust or challenge verification failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gateway/chat:
    post:
      summary: Execute a governed synchronous gateway request
      tags:
        - LLM Gateway
      security:
        - clientBearer: []
        - clientApiKey: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Governed response envelope returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChatResponse"
        "202":
          description: Request queued for offline replay when enabled and providers are unavailable.
        "401":
          description: Client key or desktop session is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "403":
          description: The authenticated client lacks chat scope or violates server-owned policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "422":
          description: Strict request, virtual-model, provider, or model validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "413":
          description: The request body exceeds the configured pre-execution limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "409":
          description: Idempotency key is in progress or conflicts with a changed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "429":
          description: Client admission or upstream provider rate limit was reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "503":
          description: Required admission state or provider execution is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"

  /gateway/chat/stream:
    post:
      summary: Execute a governed gateway request as server-sent events
      description: >
        Emits live governed stage, heartbeat, backpressure, evidence, validation,
        validated content-delta, completion, cancellation, and safe failure events.
        Provider text is withheld until output validation completes.
      tags:
        - LLM Gateway
      security:
        - clientBearer: []
        - clientApiKey: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Live governed SSE stage stream with validated output delivery.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Client key or desktop session is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "403":
          description: The authenticated client lacks stream scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "422":
          description: Strict request or virtual-model validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "413":
          description: The request body exceeds the configured pre-execution limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "429":
          description: Client admission limit was reached.
          content:
            application/json:
              schema:
