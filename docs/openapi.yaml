openapi: 3.0.0
info:
  title: DataLogicEngine (UKG) API
  description: Enterprise-grade AI Knowledge Synthesis & Orchestration Platform. Bridges the gap between enterprise data and LLMs using a 17-Axis Coordinate Framework and 114 mission-critical Knowledge Algorithms.
  version: 3.0.0
  contact:
    name: Support
    url: https://your-domain.com/support

servers:
  - url: http://localhost:5000/api/v1
    description: Local Development
  - url: https://api.your-domain.com/v1
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  /auth/login:
    post:
      summary: Standard Login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Successful Login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /gateway/chat:
    post:
      summary: UKG-Injected Chat Completion
      tags:
        - LLM Gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Successful Chat Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

  /truth/session:
    post:
      summary: Create Truth Engine Session
      tags:
        - Truth Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                context:
                  type: object
      responses:
        "200":
          description: Session Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /ka/workflow/high-stakes:
    post:
      summary: Execute High-Stakes Workflow
      tags:
        - Knowledge Algorithms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowRequest"
      responses:
        "200":
          description: Workflow Initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /ka/trace/{session_id}:
    get:
      summary: Get Workflow Trace
      tags:
        - Knowledge Algorithms
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow Trace Data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /settings/ai:
    get:
      summary: Get user AI preferences
      tags:
        - Settings
      responses:
        "200":
          description: Active AI preference configurations
        "401":
          description: Unauthorized
    post:
      summary: Update user AI preferences
      tags:
        - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preferred_provider:
                  type: string
                  enum: [auto, openai, azure, anthropic, google]
                preferred_model:
                  type: string
                ai_processing_enabled:
                  type: boolean
                store_chat_history:
                  type: boolean
      responses:
        "200":
          description: Settings updated successfully
        "400":
          description: Invalid provider selection
        "401":
          description: Unauthorized

  /search/global:
    get:
      summary: Cross-entity global search
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Search matches by category
        "400":
          description: Search query required

  /search/suggest:
    get:
      summary: Get search suggestions (autocomplete)
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Autocomplete options list

  /ingestion/supported:
    get:
      summary: Get supported raw file extensions
      tags:
        - Ingestion
      responses:
        "200":
          description: List of supported extensions

  /ingestion/local:
    post:
      summary: Ingest raw documents synchronously
      tags:
        - Ingestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
              required:
                - path
      responses:
        "200":
          description: Ingestion completed successfully
        "400":
          description: Invalid path or extraction error

  /ingestion/local/async:
    post:
      summary: Ingest raw documents in background
      tags:
        - Ingestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
              required:
                - path
      responses:
        "202":
          description: Ingestion initiated asynchronously
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingestion_id:
                    type: string
                  status:
                    type: string

  /ingestion/status/{ingestion_id}:
    get:
      summary: Get background ingestion status
      tags:
        - Ingestion
      parameters:
        - name: ingestion_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current background ingestion task status

  /trace/runs/{run_id}/bundle:
    get:
      summary: Get complete aggregated trace bundle
      tags:
        - Tracing
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Complete trace bundle payload (runs, stages, evidence, KAs, debate, metrics)

schemas:
  StandardResponse:
    type: object
    properties:
      success:
        type: boolean
      data:
        type: object
      error:
        type: string
        nullable: true
      timestamp:
        type: string
        format: date-time

  ChatRequest:
    type: object
    properties:
      messages:
        type: array
        items:
          type: object
          properties:
            role:
              type: string
              enum: [user, assistant, system]
            content:
              type: string
      model:
        type: string
      mode:
        type: string
        enum: [standard, ukg]
      trace_enabled:
        type: boolean

  ChatResponse:
    type: object
    properties:
      success:
        type: boolean
      data:
        type: object
        properties:
          id:
            type: string
          choices:
            type: array
            items:
              type: object
          ukg_trace:
            type: object
            properties:
              trace_id:
                type: string
              confidence:
                type: number

  WorkflowRequest:
    type: object
    properties:
      query:
        type: string
      context:
        type: object
