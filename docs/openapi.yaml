  /gateway/runs:
    post:
      summary: Create an encrypted durable governed job
      tags: [LLM Gateway]
      security:
        - clientBearer: []
        - clientApiKey: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ChatRequest"
                - type: object
                  required: [idempotency_key]
      responses:
        "202":
          description: Job accepted or an identical idempotent job replayed.
          headers:
            Location:
              schema: {type: string}
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayJob"
        "409":
          description: Idempotency conflict.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GatewayError"}
        "422":
          description: Strict job request validation failed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GatewayError"}
        "429":
          description: Client job queue is full.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GatewayError"}
    get:
      summary: List jobs visible to the authenticated principal
      tags: [LLM Gateway]
      security:
        - clientBearer: []
        - clientApiKey: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: Content-free job metadata.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: {$ref: "#/components/schemas/GatewayJob"}
                additionalProperties: false

  /gateway/runs/{job_id}:
    get:
      summary: Read durable gateway job status
      tags: [LLM Gateway]
      security:
        - clientBearer: []
        - clientApiKey: []
        - sessionCookie: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Content-free job status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GatewayJob"}
        "404":
          description: Job is absent or not visible to this principal.

  /gateway/runs/{job_id}/result:
    get:
      summary: Read the authenticated encrypted job result
      tags: [LLM Gateway]
      security:
        - clientBearer: []
        - clientApiKey: []
        - sessionCookie: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Completed governed result and job metadata.
        "202":
          description: Job is still queued or running.
          headers:
            Retry-After:
              schema: {type: integer}
        "409":
          description: Terminal job has no result payload.
        "404":
          description: Job is absent or not visible to this principal.

