          description: Only governed virtual models; provider credentials and raw model catalog are excluded.

  /v1/chat/completions:
    post:
      summary: Execute the bounded OpenAI-compatible chat facade
      description: >
        Supports one completion, the three governed virtual models, sync or SSE,
        temperature, one output-token limit, and an optional user/session ID.
        Unknown OpenAI fields are rejected and this facade always enters the
        native DataLogicEngine governed contract.
      tags: [LLM Gateway]
      servers:
        - url: http://localhost:5000
      security:
        - clientBearer: []
        - clientApiKey: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Supported for non-streaming calls only.
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OpenAIChatCompletionRequest"}
      responses:
        "200":
          description: OpenAI-shaped completion JSON or SSE chunks with a `dle` governance extension.
          content:
            application/json:
              schema: {type: object}
            text/event-stream:
              schema: {type: string}
        "401": {description: Invalid client key.}
        "403": {description: Insufficient chat or stream scope.}
        "409": {description: Idempotency conflict.}
        "422": {description: Unsupported or invalid compatibility field.}
        "429": {description: Client or provider limit reached.}
        "503": {description: Required gateway capability is unavailable.}

