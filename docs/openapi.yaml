          required: true
          schema: {type: string}
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [pause, resume, cancel, retry, repair, delete]
      responses:
        "200":
          description: Updated durable job or reconciliation state.

  /dataset/export:
    post:
      summary: Export governed candidate training data
      description: Creates SFT or PRM candidate data below the app-owned runtime dataset directory. DPO is not available from current persisted traces.
      tags: [Dataset Preparation]
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                export_type:
                  type: string
                  enum: [sft, prm]
                  default: sft
                format_type:
                  type: string
                  enum: [jsonl, parquet]
                  default: parquet
                min_confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 0.98
                limit:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  default: 1000
      responses:
        "200":
          description: Redacted app-owned dataset artifact metadata.
        "400":
          description: Export parameters are invalid.

  /dataset/stats:
    get:
      summary: Get candidate dataset-export statistics
      tags: [Dataset Preparation]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Release-candidate trace counts and supported formats.

  /dataset/training-admissions:
    post:
      summary: Record a model-training admission
      description: >
        Profiles an existing app-owned dataset, executes KA-085 and KA-086
        before KA-081, and writes one idempotent admission receipt. This does
        not start training, assign a worker, call a provider, run an epoch,
        create a checkpoint, or create/deploy a model artifact.
      tags: [Dataset Preparation]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
        - name: X-Request-ID
          in: header
          required: false
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingAdmissionRequest"
      responses:
        "201":
          description: Idempotent provider-owned admission record and receipt; training_started is false.
        "400":
          description: Artifact, evidence, path, idempotency, or KA admission was rejected.

  /dataset/evaluations:
    post:
      summary: Evaluate supplied model outcomes
      description: Computes measured accuracy and macro classification metrics from non-empty equal-length predictions and labels. It performs no inference or artifact effect.
      tags: [Dataset Preparation]
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelEvaluationRequest"
      responses:
        "200":
          description: Measured KA-082 evaluation with zero effects.
        "400":
          description: Evaluation evidence was invalid or incomplete.

  /memory/review:
    get:
      summary: Review owner memory by trust state
      tags: [Memory]
      security:
        - sessionCookie: []
      responses:
        "200": {description: Working and validated memory review.}

  /memory/export:
    get:
      summary: Export integrity-protected owner memory
      tags: [Memory]
      security:
        - sessionCookie: []
      responses:
        "200": {description: Versioned memory export.}

  /memory/compact:
    post:
      summary: Compact owner memory
      tags: [Memory]
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200": {description: Compaction result.}

  /memory/recover:
    post:
      summary: Recover owner memory from its integrity-checked backup
      tags: [Memory]
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200": {description: Recovery result.}

  /memory/{vertex_id}:
    delete:
      summary: Delete one owner memory vertex
      tags: [Memory]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: vertex_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: Deletion result.}

  /trace/runs:
    get:
      summary: List trace runs
      tags:
        - Tracing
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Trace run list envelope.
  /trace/runs/{run_id}/bundle:
    get:
      summary: Get an aggregated trace bundle
      tags:
        - Tracing
      security:
        - sessionCookie: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Aggregated trace bundle payload.

  /trace/runs/{run_id}/export:
    post:
      summary: Export a trace run bundle
      tags:
        - Tracing
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sign_bundle:
                  type: boolean
                  default: true
                encrypt_bundle:
                  type: boolean
                  default: false
      responses:
        "200":
          description: JSON trace export document.
        "400":
          description: Export options are invalid or encryption key is missing.
  /health:
    get:
      summary: Health probe
      tags:
        - Operations
      servers:
        - url: http://localhost:5000
          description: Unversioned local operational endpoint
      responses:
        "200":
          description: Backend process health.

  /ready:
    get:
      summary: Readiness probe
      tags:
        - Operations
      servers:
        - url: http://localhost:5000
          description: Unversioned local operational endpoint
      responses:
        "200":
          description: Backend ready for traffic.
