      security:
        - clientBearer: []
        - clientApiKey: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "202":
          description: Cancellation recorded and signalled.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GatewayJob"}
        "409":
          description: Job was already terminal.
        "404":
          description: Job is absent or not visible to this principal.

